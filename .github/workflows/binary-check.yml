name: Binary release verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            architecture: arm64
          - os: macos-15-intel
            architecture: x86_64
          - os: macos-14
            architecture: universal
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: swift test
      - name: Package exact commit
        run: python3 scripts/package-app.py '${{ matrix.architecture }}' --output dist/binaries
      - name: Verify extracted app launch
        run: python3 scripts/verify-app.py dist/binaries/*.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-${{ matrix.architecture }}
          path: dist/binaries/*
          if-no-files-found: error
          retention-days: 30
