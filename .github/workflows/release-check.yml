name: Source release check (no publishing)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: swift test
      - run: python3 scripts/smoke-test.py
      - run: python3 scripts/package-source.py
